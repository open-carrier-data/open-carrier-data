name: Validate carrier data

on:
  workflow_dispatch:
    inputs:
      simulate_today:
        description: "Run the freshness alarm as if today were this UTC date (YYYY-MM-DD). Empty means the real date."
        required: false
        default: ""
      checks_only:
        description: "Run only the validate job, without the freshness alarm. The OCD Check reports workflow sets it for its pull request branch."
        type: boolean
        required: false
        default: false
  push:
    branches: [main]
  # edited: a phone-guard-accept line added to the body checks again.
  pull_request:
    types: [opened, synchronize, reopened, edited]
  # The merge queue (rule decisions round 37, item 4): a queue run checks
  # the tree that lands, with the guard against merge_group.base_sha.
  merge_group:
    types: [checks_requested]
  schedule:
    - cron: "17 4 * * *"

permissions:
  contents: read

jobs:
  validate:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # A queue run and a dispatched run read the accept lines from the pull
      # request's body through the API at run time.
      pull-requests: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      # Rule decisions round 37, items 3 and 4: validate never passes on a
      # ref other than main without the phone-level guard, and the guard, the
      # F5 read check, the OCD dataset's base manifest and the CarrierConfig
      # report all compare with one base: a pull request's base commit,
      # merge_group.base_sha in a queue run, or the merge base with main on a
      # dispatched run. The accept lines come only from the one pull request
      # the event names (pull_request, merge_group) or, on a dispatch, from the
      # one open pull request whose head SHA is the run's; never from a
      # dispatch input. tools/guard_context.py has the rules; a queue run that
      # cannot name exactly one pull request fails here.
      - name: Resolve the base and the accept lines
        id: context
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/guard_context.py resolve --out "$RUNNER_TEMP/guard-context.json"
      - name: Validate carrier profiles and the stable index
        run: python3 tools/validate_public_carrier_data.py carriers generated/index.json --freshness warn
      # Rule round 45, item 1: profile IDs are assigned once and kept. The
      # registry (carriers/open and aliases/ids.json) against itself and every
      # generated or side file, and against the base: every base ID still live
      # or aliased, aliases only added, the same SIMs under the same ID, and a
      # new ID only in the issued form for a new match set.
      - name: Test frozen profile IDs
        run: python3 tools/test_profile_ids.py
      - name: Check profile IDs against the registry and the base
        env:
          BASE_SHA: ${{ steps.context.outputs.base || github.event.before }}
        run: |
          base=()
          if [ -n "$BASE_SHA" ] && [ "$BASE_SHA" != "0000000000000000000000000000000000000000" ]; then
            git fetch --no-tags --depth=1 origin "$BASE_SHA"
            base=(--base-ref "$BASE_SHA")
          fi
          python3 tools/profile_ids.py check --root . --require-aliases "${base[@]}"
      # Rule round 45, item 4: depends_on and for_you are exactly what
      # tools/two_answers.py derives from the published statements, identity
      # table, evidence index and device records, lookup.json repeats them,
      # and, against the base, a profile whose for_you or depends_on changed
      # while its capability evidence did not keeps its capabilities.
      - name: Test the two answers (depends_on, for_you)
        run: python3 tools/test_two_answers.py
      - name: Check depends_on and for_you against the published files and the base
        env:
          BASE_SHA: ${{ steps.context.outputs.base || github.event.before }}
        run: |
          base=()
          if [ -n "$BASE_SHA" ] && [ "$BASE_SHA" != "0000000000000000000000000000000000000000" ]; then
            git fetch --no-tags --depth=1 origin "$BASE_SHA"
            base=(--base-ref "$BASE_SHA")
          fi
          python3 tools/two_answers.py check --root . "${base[@]}"
      - name: Validate the device catalog
        run: python3 tools/validate_device_catalog.py generated/devices --freshness warn
      - name: Validate the device records
        run: python3 tools/validate_carrier_variants.py . --freshness warn
      - name: Test generated Android outputs
        run: python3 tools/test_generated_android_outputs.py
      - name: Test the carrier relevance contract
        run: python3 tools/test_carrier_relevance_contract.py
      - name: Test profile resolution
        run: python3 tools/test_resolve_carrier_profiles.py
      - name: Test the apns-conf diff
        run: python3 tools/test_diff_apns_conf.py
      - name: Test the Android phone model
        run: python3 tools/test_android_phone_model.py
      - name: Test the phone-level guard
        run: python3 tools/test_phone_guard.py
      - name: Test the guard's base and accept lines (pull request, queue, dispatch)
        run: python3 tools/test_guard_context.py
      - name: Test the CarrierConfig diff
        run: python3 tools/test_diff_carrier_config.py
      - name: Test the device records validator
        run: python3 tools/test_validate_carrier_variants.py
      - name: Test the release notes
        run: python3 tools/test_release_notes.py
      - name: Test the release build
        run: python3 tools/test_build_release.py
      - name: Test the OCD Check report tool
        run: python3 tools/test_observed_reports.py
      - name: Test the OCD dataset (matcher vectors, selectors, generator, reader checks)
        run: python3 tools/test_ocd_dataset.py
      - name: Test the F5 reads (emergency lines, rules, chain)
        run: python3 tools/test_f5_read.py
      # Rule round 32: generated/operators/ (operator statements and the
      # carrier-identity table) and rule 3's prefix limits on every published
      # file, checked directly, not only through regeneration.
      - name: Test the operators validator
        run: python3 tools/test_validate_operators.py
      - name: Validate generated/operators and rule 3's prefix limits on every published file
        run: python3 tools/validate_operators.py . --freshness warn
      # The OCD dataset for the owner's ROM (rule round 30): the schemas, the
      # reader's checks 4 to 10, the device-record rules, the privacy guard on
      # the Google lane, and a regeneration that must give the same bytes. On
      # a pull request a changed dataset must also carry a later generated_at
      # than main's, which orders datasets on the phone.
      - name: Validate the OCD dataset
        env:
          BASE_SHA: ${{ steps.context.outputs.base }}
        run: |
          base=()
          if [ -n "$BASE_SHA" ]; then
            git fetch --no-tags --depth=1 origin "$BASE_SHA"
            if git show "$BASE_SHA:generated/ocd-dataset/manifest.json" > "$RUNNER_TEMP/base-manifest.json" 2>/dev/null; then
              base=(--base-manifest "$RUNNER_TEMP/base-manifest.json")
            fi
          fi
          python3 tools/ocd_dataset.py validate --root . "${base[@]}"
      # Rule round 31, SM6: every change of the APN rows on main carries its
      # F5 read in generated/ocd-dataset/f5-reads.json, and an emergency-line
      # change only with a read that proceeds. The read is tools/f5_read.py's
      # deterministic check, rerun here from the base: the resolved base of
      # a pull request, queue or dispatched run, or the commit before a push
      # to main.
      - name: Check the F5 reads of emergency-line changes
        env:
          BASE_SHA: ${{ steps.context.outputs.base || github.event.before }}
        run: |
          args=()
          if [ -n "$BASE_SHA" ] && [ "$BASE_SHA" != "0000000000000000000000000000000000000000" ]; then
            git fetch --no-tags --depth=1 origin "$BASE_SHA"
            if git show "$BASE_SHA:generated/android/apns-conf.xml" > "$RUNNER_TEMP/f5-base-apns-conf.xml" 2>/dev/null; then
              git show "$BASE_SHA:generated/ocd-dataset/f5-reads.json" > "$RUNNER_TEMP/f5-base-reads.json" 2>/dev/null || : > "$RUNNER_TEMP/f5-base-reads.json"
              args=(--base-xml "$RUNNER_TEMP/f5-base-apns-conf.xml" --base-file "$RUNNER_TEMP/f5-base-reads.json" --base-commit "$BASE_SHA")
            fi
          fi
          python3 tools/f5_read.py check --root . "${args[@]}"
      - name: Validate observed/ (unverified reports, apart from the data)
        run: python3 tools/observed_reports.py validate --root .
      - name: Regenerate Android outputs and confirm nothing drifted
        run: |
          python3 tools/generate_android_outputs.py carriers generated --apn-version 8
          git diff --exit-code -- generated
          untracked="$(git ls-files --others --exclude-standard -- generated)"
          if [ -n "$untracked" ]; then
            echo "Generated files the commit lacks:" >&2
            echo "$untracked" >&2
            exit 1
          fi
      - name: Phone-level guard
        # Holds a change whose apns-conf.xml takes a phone's internet, attach
        # or working MMS away, or moves MMS off a current vendor's tuple, the
        # base's (--base-ref, rule decisions round 35, item E) or the head's,
        # unless the pull request's body has the line
        # `phone-guard-accept: DIGEST` for exactly these trips. It runs on
        # every ref other than main (round 37, item 3), also after an earlier
        # step failed, so its report is always there. The body is read from
        # the event or the API into the tool, never put into the script text.
        if: ${{ !cancelled() && github.ref != 'refs/heads/main' }}
        env:
          BASE_SHA: ${{ steps.context.outputs.base }}
        run: |
          if [ -z "$BASE_SHA" ]; then
            echo "::error::No base was resolved for this run; the phone-level guard fails closed."
            exit 1
          fi
          git fetch --no-tags --depth=1 origin "$BASE_SHA"
          status=0
          python3 tools/guard_context.py guard --context "$RUNNER_TEMP/guard-context.json" \
            > "$RUNNER_TEMP/phone-guard.txt" 2>&1 || status=$?
          cat "$RUNNER_TEMP/phone-guard.txt"
          {
            echo "## Phone-level guard"
            echo
            echo '```'
            cat "$RUNNER_TEMP/phone-guard.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$status" -ne 0 ]; then
            echo "::error::The phone-level guard holds this change (exit $status). Fix the trips, or add the line 'phone-guard-accept: DIGEST' to the pull request's body after a review rules them intended. A dispatched run takes accept lines only from the one open pull request whose head SHA is the run's."
          fi
          exit "$status"
      - name: CarrierConfig diff, report only
        # On a pull request, queue or dispatched run that changes
        # carrier-config-list.xml, against the same base as the guard: the
        # safety-class lines (emergency, e911, ecbm, WPS, TTY, RTT, iwlan.*)
        # in full and the other keys per key, in the step summary. It never
        # fails the job (rule decisions of 2026-10-18, round 20).
        if: ${{ !cancelled() && steps.context.outputs.base != '' }}
        continue-on-error: true
        env:
          BASE_SHA: ${{ steps.context.outputs.base }}
        run: |
          base_xml="$RUNNER_TEMP/base-carrier-config-list.xml"
          git fetch --no-tags --depth=1 origin "$BASE_SHA" || exit 0
          git show "$BASE_SHA:generated/android/carrier-config-list.xml" > "$base_xml" || exit 0
          if cmp -s "$base_xml" generated/android/carrier-config-list.xml; then
            echo "carrier-config-list.xml is unchanged."
            exit 0
          fi
          python3 tools/diff_carrier_config.py "$base_xml" generated/android/carrier-config-list.xml \
            > "$RUNNER_TEMP/carrier-config-diff.txt" 2>&1 || true
          cat "$RUNNER_TEMP/carrier-config-diff.txt"
          {
            echo "## CarrierConfig diff (report only)"
            echo
            echo '```'
            cat "$RUNNER_TEMP/carrier-config-diff.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Check the APN file against LineageOS's apns-conf.xsd
        run: |
          if ! command -v xmllint >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq libxml2-utils
          fi
          xmllint --noout --schema tools/lineageos/apns-conf.xsd \
            generated/android/apns-conf.xml

  freshness-alarm:
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && !inputs.checks_only)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      SIMULATE_TODAY: ${{ inputs.simulate_today }}
      # A date (YYYY-MM-DD) up to which a stopped pipeline only warns, for a
      # deliberate pause. Set it with: gh variable set LIVENESS_SNOOZE_UNTIL
      LIVENESS_SNOOZE_UNTIL: ${{ vars.LIVENESS_SNOOZE_UNTIL }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - name: Validate with --freshness fail and --liveness fail
        id: strict
        continue-on-error: true
        shell: bash
        run: |
          today=()
          if [ -n "$SIMULATE_TODAY" ]; then
            today=(--today "$SIMULATE_TODAY")
          fi
          # The last data publish is the newest commit with the publish
          # workflow's title on the branch being validated: main for the
          # schedule, the dispatched branch for a rehearsal. If the API call
          # fails, the source checks alone decide.
          last_publish="$(
            gh api "repos/$GH_REPO/commits?sha=$GITHUB_REF_NAME&per_page=100" \
              --jq '[.[] | select(.commit.message | startswith("Update sanitized carrier data"))][0].commit.committer.date // empty' \
              2>/dev/null | cut -c1-10
          )" || last_publish=""
          liveness=(--liveness fail)
          check_day="${SIMULATE_TODAY:-$(date -u +%F)}"
          if [ -n "$LIVENESS_SNOOZE_UNTIL" ] && [[ ! "$check_day" > "$LIVENESS_SNOOZE_UNTIL" ]]; then
            liveness=(--liveness warn)
            echo "The liveness alarm is snoozed until $LIVENESS_SNOOZE_UNTIL." | tee -a "$GITHUB_STEP_SUMMARY"
          fi
          if [ -n "$last_publish" ]; then
            liveness+=(--last-publish "$last_publish")
          fi
          status=0
          python3 tools/validate_public_carrier_data.py carriers generated/index.json --freshness fail "${liveness[@]}" "${today[@]}" 2>&1 | tee strict.log || status=1
          python3 tools/validate_device_catalog.py generated/devices --freshness fail "${today[@]}" 2>&1 | tee -a strict.log || status=1
          python3 tools/validate_carrier_variants.py . --freshness fail "${today[@]}" 2>&1 | tee -a strict.log || status=1
          python3 tools/validate_operators.py . --freshness fail "${today[@]}" 2>&1 | tee -a strict.log || status=1
          # Warnings do not fail the alarm, but show on the run: a Samsung
          # build whose values publish under the vendor build grace warns
          # every day until the lane rebuilds them.
          { grep '^warning: ' strict.log || true; } | while IFS= read -r line; do
            echo "::warning::${line#warning: }"
            echo "Warning: ${line#warning: }" >> "$GITHUB_STEP_SUMMARY"
          done
          exit "$status"
      - name: Open the stale-data issue when strict validation fails, close it when it passes again
        shell: bash
        run: |
          run_date="$(date -u +%F)"
          open_issue="$(gh issue list --label stale-data --state open --json number --jq '.[0].number // empty')"
          if [ "${{ steps.strict.outcome }}" = "success" ]; then
            if [ -n "$open_issue" ] && [ -z "$SIMULATE_TODAY" ]; then
              gh issue close "$open_issue" --comment "Strict validation passed again on $run_date. Closed by the freshness alarm."
              echo "Closed stale-data issue #$open_issue." >> "$GITHUB_STEP_SUMMARY"
            else
              echo "Strict validation passed on $run_date." >> "$GITHUB_STEP_SUMMARY"
            fi
            exit 0
          fi
          if [ -n "$open_issue" ]; then
            echo "Strict validation failed on $run_date. Issue #$open_issue is already open." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          title="Stale data or stopped pipeline: strict validation failed on $run_date"
          if [ -n "$SIMULATE_TODAY" ]; then
            title="Freshness alarm test: strict validation failed for simulated date $SIMULATE_TODAY"
          fi
          {
            echo "The scheduled strict validation failed on $run_date."
            if [ -n "$SIMULATE_TODAY" ]; then
              echo
              echo "This run simulated the date $SIMULATE_TODAY through workflow_dispatch. The published data may still be fresh. The next scheduled run closes this issue when the real date passes."
            fi
            echo
            echo "Pushes and pull requests keep passing, because their check runs the validators in warn mode. Consumers who run the validators with \`--freshness fail\` get the same error. Refresh the sources and publish a new snapshot, or read \`docs/consume.md\` for what a stale snapshot means."
            echo
            echo "An error that says the pipeline looks stopped names each late lane. A weekly lane is late when its source was not checked for more than 21 days, three missed weekly imports; a Samsung lane (samsung_omc, samsung_ims), which runs daily on the self-hosted runner, after 10 days. The alarm also fires when no data was published for more than 21 days. Check the private import and publish workflows and the self-hosted runner. For a deliberate pause, set the repository variable \`LIVENESS_SNOOZE_UNTIL\` to the last day of the pause; the alarm then only warns."
            echo
            echo "If a \`publish-held\` pull request is open, a publish is held by the phone-level guard; read its body first."
            echo
            echo '```'
            cat strict.log
            echo '```'
          } > issue-body.md
          gh label create stale-data --description "Published data is past its stale_after date, or the pipeline stopped" --color B60205 --force
          url="$(gh issue create --title "$title" --label stale-data --body-file issue-body.md)"
          echo "Opened $url" >> "$GITHUB_STEP_SUMMARY"
